---
# Post-installation tasks

- name: Update system packages
  ansible.builtin.apt:
    upgrade: safe
    autoremove: true
  when: proxmox_run_system_upgrades | default(true)
  tags: [post_installation]

- name: Configure logrotate for Proxmox
  ansible.builtin.template:
    src: proxmox_logrotate.j2
    dest: /etc/logrotate.d/proxmox
    mode: '0644'
  tags: [post_installation]

- name: Configure Proxmox backup settings
  ansible.builtin.template:
    src: backup_config.j2
    dest: /etc/pve/backup.conf
    mode: '0644'
  tags: [post_installation]

- name: Set up monitoring (optional)
  block:
    - name: Install monitoring tools
      ansible.builtin.apt:
        name:
          - htop
          - iotop
          - nethogs
          - nload
        state: present
    
    - name: Configure system monitoring
      ansible.builtin.template:
        src: monitoring_config.j2
        dest: /etc/cron.d/proxmox-monitoring
        mode: '0644'
  when: enable_monitoring | default(false)
  tags: [post_installation]

- name: Configure automatic updates
  ansible.builtin.template:
    src: unattended_upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
  when: enable_auto_updates | default(false)
  tags: [post_installation]

- name: Set up log monitoring
  ansible.builtin.template:
    src: log_monitoring.j2
    dest: /etc/rsyslog.d/50-proxmox.conf
    mode: '0644'
  notify: restart rsyslog
  tags: [post_installation]

- name: Configure system limits
  ansible.builtin.template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/proxmox.conf
    mode: '0644'
  tags: [post_installation]

- name: Set up health checks
  ansible.builtin.template:
    src: health_check.j2
    dest: /usr/local/bin/proxmox-health-check.sh
    mode: '0755'
  tags: [post_installation]

- name: Add health check to crontab
  ansible.builtin.cron:
    name: "Proxmox health check"
    minute: "*/15"
    job: "/usr/local/bin/proxmox-health-check.sh"
  tags: [post_installation]

- name: Create system information script
  ansible.builtin.template:
    src: system_info.j2
    dest: /usr/local/bin/proxmox-system-info.sh
    mode: '0755'
  tags: [post_installation]

- name: Final system reboot (if needed)
  ansible.builtin.reboot:
    msg: "Rebooting after Proxmox installation"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
  when: require_reboot | default(false)
  tags: [post_installation]
