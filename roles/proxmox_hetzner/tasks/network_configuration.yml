---
# Network configuration tasks

- name: Configure network interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    backup: true
    mode: '0644'
  register: network_config_changed
  tags: [network_configuration]

- name: Restart networking if configuration changed
  ansible.builtin.systemd:
    name: networking
    state: restarted
  when: network_config_changed is changed
  tags: [network_configuration]

- name: Configure bridge for VMs
  ansible.builtin.template:
    src: bridge_config.j2
    dest: "/etc/network/interfaces.d/{{ proxmox_network.vm_bridge_name }}"
    mode: '0644'
  tags: [network_configuration]

- name: Enable IP forwarding
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true
  tags: [network_configuration]

- name: Enable IPv6 forwarding
  ansible.builtin.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    state: present
    reload: true
  tags: [network_configuration]

- name: Configure iptables for NAT
  ansible.builtin.iptables:
    chain: POSTROUTING
    table: nat
    out_interface: "{{ ansible_facts.default_ipv4.interface }}"
    jump: MASQUERADE
    comment: "NAT for VMs"
  tags: [network_configuration]

- name: Save iptables rules
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  tags: [network_configuration]

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  tags: [network_configuration]

- name: Configure DHCP server for VMs (optional)
  block:
    - name: Install dnsmasq
      ansible.builtin.apt:
        name: dnsmasq
        state: present
    
    - name: Configure dnsmasq for VM network
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/vm-network.conf
        mode: '0644'
    
    - name: Start and enable dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started
  when: proxmox_network.enable_dhcp | default(false)
  tags: [network_configuration]
